# One command: docker compose up
# Starts a local HAPI FHIR server and the converter's MLLP listener (port 2575).
# Messages sent to 2575 are converted, written to ./out and POSTed to HAPI.
# Synthetic data only. HAPI here is an unauthenticated demo server: do not expose it.
services:
  hapi:
    image: hapiproject/hapi:latest
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/fhir/metadata > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
  converter:
    build: .
    depends_on:
      hapi:
        condition: service_healthy
    ports:
      - "127.0.0.1:2575:2575"
    volumes:
      - ./out:/data/out
      - ./dead_letter:/data/dead_letter
    command: ["listen", "--host", "0.0.0.0", "--post", "http://hapi:8080/fhir"]
